<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 200" width="100" height="160" aria-label="Domtoren Utrecht Illustration">
  <!-- Base Tower Section -->
  <rect x="40" y="100" width="40" height="90" fill="#CC0000" />
  <rect x="45" y="110" width="30" height="80" fill="#FFFFFF" opacity="0.15" />
  
  <!-- Diagonal Stripe Accent -->
  <polygon points="40,140 80,100 80,120 40,160" fill="#FFCC00" />

  <!-- Middle Tower Section -->
  <rect x="44" y="60" width="32" height="40" fill="#1C4181" />
  <!-- Gothic Arches -->
  <path d="M 50 85 A 6 10 0 0 1 62 85 V 100 H 50 Z" fill="#FFFFFF" />
  <path d="M 58 85 A 6 10 0 0 1 70 85 V 100 H 58 Z" fill="#FFFFFF" />

  <!-- Lantern / Spire Octagon -->
  <polygon points="50,25 70,25 74,60 46,60" fill="#CC0000" />
  <polygon points="60,5 65,25 55,25" fill="#FFCC00" />
  
  <!-- Cross Top -->
  <line x1="60" y1="0" x2="60" y2="8" stroke="#CC0000" stroke-width="2" />
  <line x1="57" y1="3" x2="63" y2="3" stroke="#CC0000" stroke-width="2" />
</svg>
