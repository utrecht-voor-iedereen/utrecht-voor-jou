<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="160" height="64" aria-label="Utrecht Canal & Bridge Illustration">
  <!-- Water / Oudegracht -->
  <rect x="0" y="50" width="200" height="30" fill="#009ED4" opacity="0.3" />
  <path d="M 0 55 Q 25 50, 50 55 T 100 55 T 150 55 T 200 55" fill="none" stroke="#006DFF" stroke-width="2" />
  <path d="M 0 65 Q 25 60, 50 65 T 100 65 T 150 65 T 200 65" fill="none" stroke="#009ED4" stroke-width="1.5" />

  <!-- Arch Bridge -->
  <path d="M 10 50 Q 100 10, 190 50 L 200 50 L 200 35 Q 100 -5, 0 35 L 0 50 Z" fill="#CC0000" />
  <path d="M 30 50 A 70 30 0 0 1 170 50 Z" fill="#FFFFFF" />

  <!-- Railings -->
  <line x1="20" y1="30" x2="180" y2="30" stroke="#FFCC00" stroke-width="3" />
  <line x1="40" y1="30" x2="40" y2="40" stroke="#FFCC00" stroke-width="2" />
  <line x1="80" y1="30" x2="80" y2="36" stroke="#FFCC00" stroke-width="2" />
  <line x1="120" y1="30" x2="120" y2="36" stroke="#FFCC00" stroke-width="2" />
  <line x1="160" y1="30" x2="160" y2="40" stroke="#FFCC00" stroke-width="2" />
</svg>
