<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="120" height="75" aria-label="Bicycle Illustration">
  <!-- Wheels -->
  <circle cx="35" cy="65" r="25" stroke="#000000" stroke-width="4" fill="none" />
  <circle cx="35" cy="65" r="3" fill="#000000" />
  <circle cx="125" cy="65" r="25" stroke="#000000" stroke-width="4" fill="none" />
  <circle cx="125" cy="65" r="3" fill="#000000" />

  <!-- Spokes -->
  <line x1="35" y1="40" x2="35" y2="90" stroke="#757575" stroke-width="1.5" />
  <line x1="10" y1="65" x2="60" y2="65" stroke="#757575" stroke-width="1.5" />
  <line x1="125" y1="40" x2="125" y2="90" stroke="#757575" stroke-width="1.5" />
  <line x1="100" y1="65" x2="150" y2="65" stroke="#757575" stroke-width="1.5" />

  <!-- Frame (Dutch Omafiets style with red Utrecht stripe) -->
  <path d="M 35 65 L 70 65 L 105 35 L 125 65" fill="none" stroke="#CC0000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 35 65 L 75 35 L 115 35" fill="none" stroke="#CC0000" stroke-width="4" stroke-linecap="round" />
  <line x1="70" y1="65" x2="65" y2="28" stroke="#CC0000" stroke-width="4" />

  <!-- Saddle & Handlebars -->
  <path d="M 55 28 H 75" stroke="#000000" stroke-width="5" stroke-linecap="round" />
  <path d="M 110 35 L 112 20 L 125 18" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" />

  <!-- Front crate/basket yellow accent -->
  <rect x="120" y="25" width="22" height="15" rx="3" fill="#FFCC00" stroke="#000000" stroke-width="2" />
</svg>
